# Push a tag like v0.2.0 to build the server and agent for x64 and arm64 and publish a GitHub release.
# install/install.sh and install/agent-install.sh download these assets by name:
#   sentinel-server-linux-{x64,arm64}  sentinel-agent-linux-{x64,arm64}  SHA256SUMS  install.sh  agent-install.sh
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-24.04
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/sentinel-web/package-lock.json
      - name: Native AOT toolchain
        run: sudo apt-get update -q && sudo apt-get install -y -q clang zlib1g-dev
      - name: Test
        if: matrix.rid == 'linux-x64'
        run: dotnet test
      - name: Publish
        run: |
          version="${GITHUB_REF_NAME#v}"
          dotnet publish src/Sentinel.Server -c Release -r ${{ matrix.rid }} -p:Version="$version" -o out/server
          dotnet publish src/Sentinel.Agent -c Release -r ${{ matrix.rid }} -p:Version="$version" -o out/agent
          mkdir dist
          cp out/server/sentinel-server dist/sentinel-server-${{ matrix.rid }}
          cp out/agent/sentinel-agent dist/sentinel-agent-${{ matrix.rid }}
          ./dist/sentinel-agent-${{ matrix.rid }} version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp install/install.sh install/agent-install.sh dist/
          chmod 755 dist/*
          (cd dist && sha256sum sentinel-* > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* --title "SentinelVPS $GITHUB_REF_NAME" --generate-notes
