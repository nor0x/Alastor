# Alastor global default policy.
# Layers merge in order: global → group → host. A layer only needs the keys it changes.
# Durations: 90s, 10m, 1h, 7d, 2w, or "permanent".
# Schedules (every recurring job): "every 6h" (interval since last run), a 5-field cron like "0 3 * * *"
# (evaluated in the host's local time zone; missed runs catch up once), or "off".

agent:
  # Remove server-pushed firewall state (blocklists) if the server is unreachable for this long ("permanent" = never).
  offlineGracePeriod: 24h
  # Install missing tools from distro repos. If false, the agent only adopts tools that are already installed.
  autoInstall: true
  heartbeatInterval: 60s     # metrics + tool health + poll for policy/commands (10s-1h)
  driftCheckInterval: 5m     # re-verify tool config/daemons without a policy change (1m-1d)
  eventFlushInterval: 5s     # ship new bans/failures to the server (1s-10m)
  banSnapshotInterval: 5m    # full ban-list resync; changes are pushed at the next flush anyway (30s-1d)
  scheduleSpread: 30m        # per-host offset for scheduled jobs so the fleet doesn't scan in the same minute (0-12h)

banning:
  enabled: true
  engine: fail2ban          # or "crowdsec" (opt-in): CrowdSec + its firewall bouncer from distro repos; jail settings are fail2ban-only
  crowdsecCentralApi: false # CrowdSec only: share signals with crowdsec.net and pull its community blocklist (off = no third-party traffic)
  manualBantime: permanent  # bans issued from the dashboard
  allowlist: []             # add your admin IP / tailnet (100.64.0.0/10) here or on the Bans page

  defaults:
    bantime: 1h
    findtime: 10m
    maxretry: 5
    bantimeIncrement: true  # repeat offenders get longer bans…
    bantimeFactor: 2
    bantimeMaxtime: 1w      # …up to one week

  jails:
    sshd:
      enabled: true

# ---- Public IP blocklists ----
# The server pulls the lists (agents never do), merges them, removes the allowlist and private/reserved ranges,
# and each agent drops matching traffic in its own nftables table ("inet alastor"; ipset on iptables-only hosts).

blocklists:
  enabled: true
  # spamhaus-drop, firehol-level1, abuse-ch-feodo, et-compromised, blocklist-de, cins-army (see the Bans page)
  lists: [spamhaus-drop]
  extra: []                 # your own IPs/CIDRs to block everywhere in scope
  refreshSchedule: every 1h # how often agents ask the server for a newer set (conditional request)

# ---- Scheduled jobs ----

updates:
  checkSchedule: every 6h    # count pending security updates
  applySchedule: "off"       # auto-install security updates, e.g. "0 4 * * *"; "off" = report only + "Apply now"
  inventorySchedule: every 6h # list installed packages and versions (Software tab); also after every upgrade/uninstall

vulnerabilities:
  scanSchedule: "0 3 * * *"  # Trivy/Grype package scan, nightly
  scanner: auto              # auto (Trivy if installed, else Grype) | trivy | grype | off
  languagePackages: true     # also npm, pip, gems, Go binaries found on disk, not only OS packages
  scanContainers: false      # also scan images of running Docker/Podman containers (local images only, nothing is pulled)
  ignorePackages: [linux-libc-dev]  # kernel headers: every kernel CVE is tracked against them, but no kernel code runs from them
  ignore: []                 # accepted CVE ids (still listed, not counted or alerted); merged across layers
  alertSeverity: high        # alert on new *fixable* findings at or above: low | medium | high | critical | off

hardening:
  auditSchedule: "0 5 * * 0" # Lynis audit, weekly (Sunday)
  ignore: []                 # accepted Lynis test ids, e.g. [BANN-7126]; still listed, not counted; merged across layers

malware:
  scanSchedule: "off"        # ClamAV is opt-in, e.g. "0 2 * * 6"; needs ~1 GB free RAM while it runs
  paths: [/var/www, /srv, /home, /tmp, /var/tmp, /dev/shm]  # scanned recursively; missing ones are skipped
  exclude: []                # directories to skip, e.g. [/srv/backups, node_modules]; merged across layers
  maxFileSize: 25M           # larger files are skipped
  rootkitSchedule: "off"     # rkhunter is opt-in, e.g. "0 4 * * 0"; reads only, never updates from the internet
  rootkitIgnore: []          # rkhunter warnings accepted as known (text fragments); merged across layers

integrity:
  checkSchedule: "off"       # AIDE is opt-in, e.g. "0 4 * * *"; the first run records the baseline
  paths: [/bin, /sbin, /usr/bin, /usr/sbin, /usr/local/bin, /usr/local/sbin, /etc, /root/.ssh, /usr/lib/systemd/system]
  exclude: []                # path prefixes to skip, e.g. [/etc/letsencrypt]; merged across layers

storage:
  scanSchedule: every 12h    # disk usage: biggest folders and files, and what can be cleaned up (Storage tab); low priority (nice/ionice)

network:
  checkSchedule: every 1h    # is SSH reachable from the internet? is Tailscale up? (reads sockets, addresses, firewall)
  allowPublicSsh: false      # true on hosts where public SSH is intended (bastion): shown as accepted, not alerted
  allowPublicPorts: [80/tcp, 443/tcp]  # services meant to face the internet; other public ports are flagged. Merged across layers

firewall:
  manage: false              # opt-in: the agent manages ufw rules tagged "alastor" (Debian/Ubuntu); others are left alone
  ssh: [any]                 # where SSH may come from: any | from CIDR | on tailscale0 (never empty, so SSH can't be locked out)
  allow: []                  # extra rules, e.g. [5432/tcp from 10.0.0.0/8, 9100/tcp on tailscale0]; network.allowPublicPorts are allowed too
  defaultIncoming: deny      # deny | reject for anything not allowed

logins:
  monitor: true              # report successful SSH logins (journald, or auth.log / secure); read-only
  alertOnNewSource: true     # alert on a user's first login from an address (High; Critical for root)
  trustedSources: []         # addresses/CIDRs logins are expected from (office, VPN): never alerted; merged across layers
  keysSchedule: every 1h     # read every account's authorized_keys for the SSH keys tab; also after each key change
  alertOnNewKey: true        # alert when a key appears that wasn't added from the dashboard (High; Critical for root)

# ---- Security baseline ----

baseline:
  checkSchedule: every 1h    # run the baseline checks (SSH, firewall, updates, kernel, accounts); takes a second
  # Check id -> "apply" (the agent enforces the fix with a managed drop-in), "ignore" (accepted risk)
  # or "report" (the default; lets a group/host undo a lower layer's apply).
  # Unlisted checks are only reported. Use the Baseline page to apply fixes per host, group or fleet.
  mitigations: {}
