# Alastor server with Docker Compose.
#
#   ALASTOR_ADMINPASSWORD='a long passphrase' ALASTOR_PUBLICURL=https://alastor.example.com docker compose up -d
#
# Put a TLS-terminating reverse proxy (Caddy, Traefik, nginx) in front of port 8080: agents refuse plain HTTP
# unless enrolled with --insecure. For PostgreSQL instead of the built-in SQLite, start with --profile postgres
# and set ALASTOR_DATABASEPROVIDER=postgres (see below).

services:
  alastor:
    build: .
    image: alastor:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - alastor-data:/data
    environment:
      ALASTOR_ADMINPASSWORD: ${ALASTOR_ADMINPASSWORD:?set ALASTOR_ADMINPASSWORD for the first admin login}
      ALASTOR_PUBLICURL: ${ALASTOR_PUBLICURL:-http://localhost:8080}
      # Behind a plain-HTTP setup (local testing only), the session cookie must not be Secure:
      ALASTOR_SECURECOOKIES: ${ALASTOR_SECURECOOKIES:-true}
      # PostgreSQL (with --profile postgres):
      ALASTOR_DATABASEPROVIDER: ${ALASTOR_DATABASEPROVIDER:-sqlite}
      ALASTOR_CONNECTIONSTRING: ${ALASTOR_CONNECTIONSTRING:-}

  postgres:
    profiles: [postgres]
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: alastor
      POSTGRES_USER: alastor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - alastor-postgres:/var/lib/postgresql/data
    # Then: ALASTOR_DATABASEPROVIDER=postgres
    #       ALASTOR_CONNECTIONSTRING="Host=postgres;Database=alastor;Username=alastor;Password=change-me"

volumes:
  alastor-data:
  alastor-postgres:
